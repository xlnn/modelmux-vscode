name: Release VS Code extension

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package versioned VSIX
        id: package
        shell: bash
        run: |
          npm run package
          version="$(node -p "require('./package.json').version")"
          vsix="modelmux-${version}.vsix"
          test -f "$vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      - name: Verify GitHub Release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          expected="v${{ steps.package.outputs.version }}"
          actual="${{ github.event.release.tag_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag $actual does not match package version $expected." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: modelmux-${{ steps.package.outputs.version }}-vsix
          path: ${{ steps.package.outputs.vsix }}
      - name: Upload VSIX to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.vsix }}" --clobber
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "${{ steps.package.outputs.vsix }}" -p "$VSCE_PAT"
